<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R. Data Extractor Pro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .provider-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .provider-box label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .provider-box select {
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            background: transparent;
            cursor: pointer;
            outline: none;
        }

        /* Main Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Drop & Paste Zone */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 28px 16px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .drop-zone-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .drop-zone h3 {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }

        .drop-zone p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        .kbd {
            background: #e2e8f0;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-weight: 700;
            color: #1e293b;
            font-size: 12px;
        }

        /* Image Thumbnails Queue */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 16px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .thumb-card {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: #f1f5f9;
        }

        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .thumb-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            padding: 2px 4px;
            background: rgba(15, 23, 42, 0.75);
            color: white;
        }

        .thumb-status.done { background: rgba(16, 185, 129, 0.9); }
        .thumb-status.error { background: rgba(239, 68, 68, 0.9); }
        .thumb-status.working { background: rgba(79, 70, 229, 0.9); }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-secondary { background: #e5e7eb; color: #374151; flex: 0.4; }
        .btn-secondary:hover:not(:disabled) { background: #d1d5db; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: #f8fafc; border: 1px solid #cbd5e1; color: #334155; }
        .btn-outline:hover { background: #f1f5f9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Progress Bar */
        .progress-wrapper {
            margin-top: 14px;
            display: none;
        }

        .progress-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Output Area */
        .badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 99px;
            background: #eef2ff;
            color: var(--primary);
            font-weight: 600;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 290px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13.5px;
            resize: vertical;
            background: #f8fafc;
            color: #0f172a;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
            background: #fff;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s ease;
            pointer-events: none;
            z-index: 999;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Header -->
    <div class="header">
        <h1>📋 G.R. Sheet Extractor</h1>
        <div class="provider-box">

    <div class="grid">

        <div class="card">

            <textarea id="resultBox" placeholder='17195,"04-11-2026 - 15 CRTNS"&#10;54739,"04-11-2026 - 10 CRTNS"' oninput="updateRowCount()"></textarea>

            <div class="btn-group">
                <button class="btn btn-success" onclick="copyResult()">
                    📋 Copy Result
                </button>
                <button class="btn btn-outline" onclick="downloadCSV()">
                    ⬇️ Download CSV
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toast">Copied to clipboard!</div>
