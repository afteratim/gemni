<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R. Data Extractor Pro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .provider-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .provider-box label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .provider-box select {
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            background: transparent;
            cursor: pointer;
            outline: none;
        }

        /* Main Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Drop & Paste Zone */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 28px 16px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .drop-zone-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .drop-zone h3 {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }

        .drop-zone p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        .kbd {
            background: #e2e8f0;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-weight: 700;
            color: #1e293b;
            font-size: 12px;
        }

        /* Image Thumbnails Queue */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 16px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .thumb-card {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: #f1f5f9;
        }

        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .thumb-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            padding: 2px 4px;
            background: rgba(15, 23, 42, 0.75);
            color: white;
        }

        .thumb-status.done { background: rgba(16, 185, 129, 0.9); }
        .thumb-status.error { background: rgba(239, 68, 68, 0.9); }
        .thumb-status.working { background: rgba(79, 70, 229, 0.9); }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-secondary { background: #e5e7eb; color: #374151; flex: 0.4; }
        .btn-secondary:hover:not(:disabled) { background: #d1d5db; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: #f8fafc; border: 1px solid #cbd5e1; color: #334155; }
        .btn-outline:hover { background: #f1f5f9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Progress Bar */
        .progress-wrapper {
            margin-top: 14px;
            display: none;
        }

        .progress-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Output Area */
        .badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 99px;
            background: #eef2ff;
            color: var(--primary);
            font-weight: 600;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 290px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13.5px;
            resize: vertical;
            background: #f8fafc;
            color: #0f172a;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
            background: #fff;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s ease;
            pointer-events: none;
            z-index: 999;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Header -->
    <div class="header">
        <h1>📋 G.R. Sheet Extractor</h1>
        <div class="provider-box">
            <label for="providerSelect">AI Engine:</label>
            <select id="providerSelect">
                <option value="auto">Auto (Gemini + Groq)</option>
                <option value="gemini">Gemini Only</option>
                <option value="groq">Groq Only</option>
            </select>
        </div>
    </div>

    <!-- Two Column Layout -->
    <div class="grid">
        <!-- Left Card: Upload & Paste -->
        <div class="card">
            <div class="card-title">
                <span>1. Add Images</span>
                <span class="badge" id="imageCountBadge">0 Images</span>
            </div>

            <div class="drop-zone" id="dropZone" onclick="document.getElementById('imageInput').click()">
                <div class="drop-zone-icon">📸</div>
                <h3>Click to Browse or Drag & Drop</h3>
                <p>Or simply press <span class="kbd">Ctrl</span> + <span class="kbd">V</span> anywhere to paste copied images!</p>
                <input type="file" id="imageInput" multiple accept="image/*" style="display:none">
            </div>

            <!-- Thumbnails Preview -->
            <div class="preview-grid" id="previewGrid"></div>

            <!-- Progress Bar -->
            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-text">
                    <span id="progressStatus">Processing...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="processBtn" onclick="uploadImages()">
                    ⚡ Extract Data
                </button>
                <button class="btn btn-secondary" id="clearBtn" onclick="clearQueue()">
                    🗑️ Clear
                </button>
            </div>
        </div>

        <!-- Right Card: Results -->
        <div class="card">
            <div class="card-title">
                <span>2. Extracted Output</span>
                <span class="badge" id="rowCountBadge">0 Rows</span>
            </div>

            <textarea id="resultBox" placeholder='17195,"04-11-2026 - 15 CRTNS"&#10;54739,"04-11-2026 - 10 CRTNS"' oninput="updateRowCount()"></textarea>

            <div class="btn-group">
                <button class="btn btn-success" onclick="copyResult()">
                    📋 Copy Result
                </button>
                <button class="btn btn-outline" onclick="downloadCSV()">
                    ⬇️ Download CSV
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toast">Copied to clipboard!</div>

<script>
    let imageQueue = [];
    let pasteCounter = 1;

    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const previewGrid = document.getElementById('previewGrid');
    const imageCountBadge = document.getElementById('imageCountBadge');
    const resultBox = document.getElementById('resultBox');
    const rowCountBadge = document.getElementById('rowCountBadge');

    // 1. Handle File Input Browse
    imageInput.addEventListener('change', (e) => {
        addFilesToQueue(e.target.files);
        imageInput.value = ''; // Reset so same file can be selected again if needed
    });

    // 2. Handle Drag & Drop
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            addFilesToQueue(e.dataTransfer.files);
        }
    });

    // 3. Handle Ctrl+V Copy-Paste Anywhere on Page
    window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        const pastedFiles = [];

        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                const blob = items[i].getAsFile();
                const ext = blob.type.split('/')[1] || 'png';
                const customFile = new File([blob], `Pasted_Image_${pasteCounter++}.${ext}`, { type: blob.type });
                pastedFiles.push(customFile);
            }
        }

        if (pastedFiles.length > 0) {
            e.preventDefault();
            addFilesToQueue(pastedFiles);
            showToast(`📸 Pasted ${pastedFiles.length} image(s)!`);
        }
    });

    function addFilesToQueue(files) {
        for (let i = 0; i < files.length; i++) {
            if (files[i].type.startsWith('image/')) {
                imageQueue.push({
                    file: files[i],
                    id: Date.now() + Math.random(),
                    status: 'Pending'
                });
            }
        }
        renderQueue();
    }

    function removeImage(id) {
        imageQueue = imageQueue.filter(item => item.id !== id);
        renderQueue();
    }

    function clearQueue() {
        imageQueue = [];
        pasteCounter = 1;
        renderQueue();
        document.getElementById('progressWrapper').style.display = 'none';
        showToast("Queue cleared");
    }

    function renderQueue() {
        previewGrid.innerHTML = '';
        imageCountBadge.innerText = `${imageQueue.length} Image${imageQueue.length === 1 ? '' : 's'}`;

        imageQueue.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'thumb-card';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(item.file);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'thumb-remove';
            removeBtn.innerHTML = '✕';
            removeBtn.title = 'Remove image';
            removeBtn.onclick = (e) => {
                e.stopPropagation();
                removeImage(item.id);
            };

            const status = document.createElement('div');
            status.id = `status-${item.id}`;
            status.className = 'thumb-status';
            status.innerText = `#${index + 1} Ready`;

            card.appendChild(img);
            card.appendChild(removeBtn);
            card.appendChild(status);
            previewGrid.appendChild(card);
        });
    }

    async function uploadImages() {
        if (imageQueue.length === 0) {
            showToast("⚠️ Please add or paste at least one image!");
            return;
        }

        const provider = document.getElementById('providerSelect').value;
        const processBtn = document.getElementById('processBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');
        const progressStatus = document.getElementById('progressStatus');
        const progressPercent = document.getElementById('progressPercent');

        processBtn.disabled = true;
        clearBtn.disabled = true;
        progressWrapper.style.display = 'block';
        resultBox.value = '';
        updateRowCount();

        for (let i = 0; i < imageQueue.length; i++) {
            const item = imageQueue[i];
            const statusEl = document.getElementById(`status-${item.id}`);
            
            const pct = Math.round((i / imageQueue.length) * 100);
            progressBar.style.width = `${pct}%`;
            progressPercent.innerText = `${pct}%`;
            progressStatus.innerText = `Reading image ${i + 1} of ${imageQueue.length}...`;

            if (statusEl) {
                statusEl.className = 'thumb-status working';
                statusEl.innerText = 'Reading...';
            }

            const formData = new FormData();
            formData.append('images', item.file);
            formData.append('provider', provider);

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const text = await response.text();
                try {
                    const data = JSON.parse(text);
                    const output = data.result || data.error;
                    resultBox.value += (resultBox.value ? '\n' : '') + output;

                    if (statusEl) {
                        const isErr = output.startsWith('Error processing');
                        statusEl.className = isErr ? 'thumb-status error' : 'thumb-status done';
                        statusEl.innerText = isErr ? 'Error ❌' : 'Done ✅';
                    }
                } catch (e) {
                    resultBox.value += `\n[Server Timeout on ${item.file.name}]`;
                    if (statusEl) {
                        statusEl.className = 'thumb-status error';
                        statusEl.innerText = 'Timeout ❌';
                    }
                }
            } catch (err) {
                resultBox.value += `\n[Network Error on ${item.file.name}]: ${err.message}`;
                if (statusEl) {
                    statusEl.className = 'thumb-status error';
                    statusEl.innerText = 'Failed ❌';
                }
            }

            updateRowCount();
        }

        progressBar.style.width = '100%';
        progressPercent.innerText = '100%';
        progressStatus.innerText = 'Completed!';
        processBtn.disabled = false;
        clearBtn.disabled = false;
        showToast("✅ Extraction completed!");
    }

    function updateRowCount() {
        const lines = resultBox.value.split('\n').filter(line => line.trim() !== '');
        rowCountBadge.innerText = `${lines.length} Row${lines.length === 1 ? '' : 's'}`;
    }

    function copyResult() {
        if (!resultBox.value.trim()) {
            showToast("⚠️ Nothing to copy!");
            return;
        }
        navigator.clipboard.writeText(resultBox.value);
        showToast("✅ Copied to clipboard!");
    }

    function downloadCSV() {
        const text = resultBox.value.trim();
        if (!text) {
            showToast("⚠️ Nothing to download!");
            return;
        }
        const blob = new Blob([text], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gr_data_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        showToast("⬇️ CSV Downloaded!");
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
    }
</script>

</body>
</html>
