<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R. Image Extractor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .upload-box { border: 2px dashed #ccc; padding: 30px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
        select, button { padding: 10px 15px; font-size: 15px; border-radius: 5px; }
        select { border: 1px solid #ccc; margin-bottom: 15px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:disabled { background: #ccc; }
        textarea { width: 100%; height: 300px; margin-top: 20px; padding: 10px; font-family: monospace; font-size: 14px; }
        .actions { margin-top: 10px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <h2>Upload G.R. Sheets</h2>
    <div class="upload-box">
        <label for="providerSelect"><strong>AI Model:</strong> </label>
        <select id="providerSelect">
            <option value="auto">Auto (Gemini + Groq Backup)</option>
            <option value="groq">Groq Only (Fastest)</option>
            <option value="gemini">Gemini Only</option>
        </select>
        <br><br>
        <input type="file" id="imageInput" multiple accept="image/*">
        <br><br>
        <button id="processBtn" onclick="uploadImages()">Extract Data</button>
    </div>

    <div id="loading" style="display:none; color: #007bff; font-weight: bold;"></div>

    <textarea id="resultBox" placeholder="Your results will appear here..." readonly></textarea>
    
    <div class="actions">
        <button onclick="copyResult()" style="background: #28a745;">Copy Text</button>
        <button onclick="downloadCSV()" style="background: #17a2b8;">Download CSV</button>
    </div>

    <script>
        async function uploadImages() {
            const input = document.getElementById('imageInput');
            const provider = document.getElementById('providerSelect').value;
            const resultBox = document.getElementById('resultBox');
            const loading = document.getElementById('loading');
            const btn = document.getElementById('processBtn');

            if (input.files.length === 0) {
                alert("Please select at least one image!");
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            resultBox.value = '';

            // Process images one by one so Render never times out
            for (let i = 0; i < input.files.length; i++) {
                const file = input.files[i];
                loading.innerText = `Processing image ${i + 1} of ${input.files.length} (${file.name})...`;

                const formData = new FormData();
                formData.append('images', file);
                formData.append('provider', provider);

                try {
                    const response = await fetch('/process', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const text = await response.text();
                    try {
                        const data = JSON.parse(text);
                        const output = data.result || data.error;
                        resultBox.value += (resultBox.value ? '\n' : '') + output;
                    } catch (e) {
                        resultBox.value += `\n[Server Timeout/Error on ${file.name}]: Status ${response.status}`;
                    }
                } catch (err) {
                    resultBox.value += `\n[Network Error on ${file.name}]: ${err.message}`;
                }
            }

            btn.disabled = false;
            loading.style.display = 'none';
        }

        function copyResult() {
            const box = document.getElementById('resultBox');
            box.select();
            document.execCommand('copy');
            alert("Copied to clipboard!");
        }

        function downloadCSV() {
            const text = document.getElementById('resultBox').value;
            if (!text) return alert("Nothing to download!");
            const blob = new Blob([text], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gr_data.csv';
            a.click();
        }
    </script>
</body>
</html>
